# fly launch --no-deploy --copy-config   (from the api/Sismo.Api folder), then:
#   fly volumes create sismo_data --size 1 --region otp
#   fly secrets set Cors__Origins__0=https://<your-vercel-domain>
#   fly deploy
app = "sismo-api"
primary_region = "otp" # Bucharest, closest to Türkiye

[build]
  dockerfile = "Dockerfile"

[env]
  Afad__UserAgent = "Sismo/1.0"

[[mounts]]
  source = "sismo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The sync loop must keep running, so the machine must not be stopped when idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
